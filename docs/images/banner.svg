<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-label="IMPOSTER - campus poster printing, fully automated">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset="0.55" stop-color="#302b63"/><stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset="0.5" stop-color="#feca57"/><stop offset="1" stop-color="#48dbfb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <circle cx="1450" cy="60" r="190" fill="#ff6b6b" opacity="0.10"/>
  <circle cx="120" cy="420" r="160" fill="#48dbfb" opacity="0.10"/>
  <!-- poster stack -->
  <g filter="url(#soft)">
    <rect x="1150" y="70" width="190" height="270" rx="10" fill="#ffffff" opacity="0.18" transform="rotate(8 1245 205)"/>
    <rect x="1190" y="60" width="190" height="270" rx="10" fill="#ffffff" opacity="0.30" transform="rotate(-4 1285 195)"/>
    <rect x="1230" y="50" width="190" height="270" rx="10" fill="#ffffff"/>
    <rect x="1248" y="68" width="154" height="170" rx="6" fill="url(#accent)"/>
    <rect x="1248" y="252" width="110" height="10" rx="5" fill="#302b63" opacity="0.8"/>
    <rect x="1248" y="272" width="70" height="8" rx="4" fill="#302b63" opacity="0.45"/>
  </g>
  <text x="90" y="190" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="108" font-weight="800" fill="#ffffff" letter-spacing="4">IMPOSTER</text>
  <rect x="94" y="212" width="360" height="8" rx="4" fill="url(#accent)"/>
  <text x="92" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" fill="#e8e6ff">Campus poster printing, fully automated.</text>
  <text x="92" y="326" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#a9a6d8">Google Form  →  n8n  →  AI upscaling  →  Print-ready in one click</text>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="92" y="362" width="118" height="42" rx="21" fill="#ffffff" opacity="0.12"/><text x="151" y="390" text-anchor="middle" fill="#fff">n8n</text>
    <rect x="224" y="362" width="150" height="42" rx="21" fill="#ffffff" opacity="0.12"/><text x="299" y="390" text-anchor="middle" fill="#fff">Next.js</text>
    <rect x="388" y="362" width="190" height="42" rx="21" fill="#ffffff" opacity="0.12"/><text x="483" y="390" text-anchor="middle" fill="#fff">Google Drive</text>
    <rect x="592" y="362" width="190" height="42" rx="21" fill="#ffffff" opacity="0.12"/><text x="687" y="390" text-anchor="middle" fill="#fff">Real-ESRGAN</text>
  </g>
</svg>
